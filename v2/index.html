<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XLpricer App</title>
    <script>
      // Apply the saved theme before first paint (mirrors
      // resolveIsDark in src/themes/ThemeProvider.tsx).
      try {
        var m = localStorage.getItem('theme-mode')
        var d = m === 'dark' || (m !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', d)
      } catch (e) { /* no storage / no JS — app stays light */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
